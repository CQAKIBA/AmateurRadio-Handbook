site_name: アマチュア無線ハンドブック
site_description: 現代のアマチュア無線を、運用・技術・製作・測定・実験・研究まで扱うオープンハンドブック

site_url: https://cqakiba.github.io/AmateurRadio-Handbook/
repo_url: https://github.com/CQAKIBA/AmateurRadio-Handbook
repo_name: CQAKIBA/AmateurRadio-Handbook
edit_uri: edit/main/docs/

docs_dir: docs

nav:
  - ホーム: index.md
  - 概要:
      - アマチュア無線とは: 00_概要/アマチュア無線とは.md
      - お前何しに来たん？: 00_概要/お前何しに来たん.md
      - 極端な成功例との付き合い方: 00_概要/極端な成功例との付き合い方.md
  - 運用:
      - 基本運用 ― 音声で最初の交信をするまで: 06_運用/基本運用.md
  - 活動・コミュニティ:
      - クラブ・サークル紹介: clubs/index.md
  - 歴史:
      - 日本のアマチュア無線のはじまり: 15_歴史/日本のアマチュア無線のはじまり.md
      - アマチュア無線と通信技術の歴史: 15_歴史/history.md
  - このプロジェクト:
      - このプロジェクトについて: about.md
      - GitHubで編集する: github.md

theme:
  name: material
  language: ja
  features:
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.code.copy

markdown_extensions:
  - tables
  - fenced_code
  - footnotes

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js
  - javascripts/mermaid-init.js
